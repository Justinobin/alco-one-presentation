<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALCO One, présentation</title>
<meta name="description" content="ALCO One réunit le pilotage du bilan, la gestion des risques, le portefeuille obligataire et le reporting réglementaire des établissements de crédit des zones UMOA et CEMAC.">
<meta name="theme-color" content="#040d24">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a2458'/%3E%3Cpath d='M5 21 L22 8 L27 20 L24 20 L21.5 13 L8 21.5 Z' fill='%236fb6ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="polices.css">
<link rel="stylesheet" href="style.css">
<script>document.documentElement.classList.add('js')</script>
</head>
<body>

<svg class="vh" aria-hidden="true">
  <defs>
    <linearGradient id="g-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/><stop offset=".42" stop-color="#b4cdf2"/><stop offset=".58" stop-color="#7aa2df"/><stop offset="1" stop-color="#4a78c4"/>
    </linearGradient>
    <linearGradient id="g-flanc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a56a3"/><stop offset="1" stop-color="#0c2252"/>
    </linearGradient>
    <linearGradient id="g-toit" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2b63c6"/><stop offset="1" stop-color="#5ea8ff"/>
    </linearGradient>
    <linearGradient id="g-toit-d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fd0ff"/><stop offset="1" stop-color="#3f84e6"/>
    </linearGradient>
    <filter id="f-ombre" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#00040f" flood-opacity=".65"/>
    </filter>
    <text id="logo-mot" x="600" y="312" text-anchor="middle" textLength="1080" lengthAdjust="spacing" font-family="Montserrat, Inter, Arial, sans-serif" font-weight="800" font-size="200">ALCO ONE</text>
  </defs>
  <!-- Le logo : capitales en relief et toit incliné au-dessus de ONE. -->
  <symbol id="logo" viewBox="0 0 1200 340">
    <g filter="url(#f-ombre)">
      <use href="#logo-mot" transform="translate(4 9)" fill="#081a40"/>
      <use href="#logo-mot" transform="translate(3 7)" fill="url(#g-flanc)"/>
      <use href="#logo-mot" transform="translate(2 5)" fill="url(#g-flanc)"/>
      <use href="#logo-mot" transform="translate(1 2.5)" fill="#3563ad"/>
      <use href="#logo-mot" fill="url(#g-face)"/>
      <polygon class="toit-g" points="520,160 990,22 1004,52 548,163" fill="url(#g-toit)"/>
      <polygon class="toit-d" points="990,22 1132,158 1100,160 1004,52" fill="url(#g-toit-d)"/>
    </g>
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
  <symbol id="i-prec" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-suiv" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3L10 14 M21 3l-7 18-4-7-7-4z"/></symbol>
</svg>

<!-- L'ouverture est la vidéo du logo. Dessous, la même composition en fixe sert quand la vidéo
     ne se lit pas. -->
<div class="ouverture" id="ouverture">
  <svg class="ouv-hud" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g class="hud-g">
      <path class="trace" d="M300 206 H470 L492 228 H880"/>
      <path class="trace" d="M935 228 H1000 L1046 182 H1444"/>
      <path class="trace" d="M226 776 H560 L582 754 H880 L904 778 H1404"/>
      <path class="trace mince" d="M600 248 H860"/>
      <path class="trace mince" d="M610 734 H860"/>
    </g>
    <g class="hud-g">
      <rect class="noeud" x="296" y="202" width="8" height="8"/><rect class="noeud" x="876" y="224" width="8" height="8"/>
      <rect class="noeud" x="1440" y="178" width="8" height="8"/><rect class="noeud" x="1400" y="774" width="8" height="8"/>
      <rect class="noeud" x="556" y="772" width="8" height="8"/><polygon class="plein" points="712,242 724,248 712,254"/>
      <polygon class="plein" points="1350,794 1362,801 1350,808"/><polygon class="plein" points="1366,794 1378,801 1366,808"/><polygon class="vide" points="1382,794 1394,801 1382,808"/>
    </g>
    <g class="hud-t">
      <path class="cadre" d="M226 166 v-10 h10 M270 156 h10 v10 M280 200 v10 h-10 M236 210 h-10 v-10"/>
      <rect class="case" x="232" y="162" width="42" height="42"/>
      <text class="n" x="253" y="190" text-anchor="middle">01</text>
      <text class="l" x="300" y="189">ALCO ONE</text>
      <text class="p" x="508" y="218">ANALYSER, ANTICIPER, PILOTER</text>
    </g>
    <g class="hud-t">
      <rect class="barre-t" x="1250" y="150" width="194" height="16"/>
      <text class="p fort" x="1436" y="162" text-anchor="end">UMOA ET CEMAC</text>
      <text class="p" x="1250" y="204">PILOTAGE DU BILAN</text><text class="p" x="1444" y="204" text-anchor="end">06</text>
      <text class="p" x="1250" y="222">GESTION DES RISQUES</text><text class="p" x="1444" y="222" text-anchor="end">03</text>
      <text class="p" x="1250" y="240">PORTEFEUILLE</text><text class="p" x="1444" y="240" text-anchor="end">01</text>
      <text class="p" x="1250" y="258">REPORTING</text><text class="p" x="1444" y="258" text-anchor="end">02</text>
    </g>
    <g class="hud-t">
      <path class="cadre" d="M170 716 v-10 h10 M214 706 h10 v10 M224 750 v10 h-10 M180 760 h-10 v-10"/>
      <circle class="anneau" cx="197" cy="733" r="12"/>
      <text class="l" x="240" y="730">ARRÊTÉ</text>
      <text class="p" x="240" y="750">LECTURE DU CLASSEUR</text>
      <rect class="rail" x="240" y="792" width="230" height="4"/><rect class="charge c1" x="240" y="792" width="230" height="4"/>
      <rect class="rail" x="240" y="802" width="230" height="4"/><rect class="charge c2" x="240" y="802" width="230" height="4"/>
      <text class="p" x="500" y="806">CONTRÔLES 26</text>
    </g>
    <g class="hud-t graphe-hud">
      <path class="axe" d="M1290 670 V760 H1440"/>
      <rect class="b" x="1300" y="734" width="9" height="26"/><rect class="b" x="1314" y="726" width="9" height="34"/>
      <rect class="b" x="1328" y="720" width="9" height="40"/><rect class="b" x="1342" y="730" width="9" height="30"/>
      <rect class="b" x="1356" y="714" width="9" height="46"/><rect class="b" x="1370" y="706" width="9" height="54"/>
      <rect class="b" x="1384" y="716" width="9" height="44"/><rect class="b" x="1398" y="698" width="9" height="62"/>
      <rect class="b" x="1412" y="686" width="9" height="74"/>
      <polyline class="courbe" points="1304,726 1318,718 1332,712 1346,722 1360,706 1374,698 1388,708 1402,690 1416,678"/>
    </g>
  </svg>
  <svg class="ouv-logo" viewBox="0 0 1200 470" role="img" aria-label="ALCO One">
    <defs>
      <linearGradient id="g-reflet" x1="0" y1="340" x2="0" y2="460" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <mask id="m-reflet" maskUnits="userSpaceOnUse" x="0" y="330" width="1200" height="140"><rect x="0" y="330" width="1200" height="140" fill="url(#g-reflet)"/></mask>
    </defs>
    <g mask="url(#m-reflet)"><use href="#logo" width="1200" height="340" transform="translate(0 676) scale(1 -1)"/></g>
    <use href="#logo" width="1200" height="340"/>
  </svg>
  <video class="ouv-video" id="ouvVideo" src="medias/ouverture.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <div class="ouv-actions">
    <p class="ouv-tag">Pilotage du bilan, gestion des risques, portefeuille obligataire</p>
    <button class="btn pri" id="ouvCommencer" type="button">Commencer <svg class="ic"><use href="#i-suiv"/></svg></button>
  </div>
  <button class="ouv-passer" id="ouvPasser" type="button">Passer l’ouverture</button>
</div>

<div class="app">
  <nav class="progression" id="chapitres" aria-label="Chapitres"></nav>
  <header class="hud">
    <div class="brand"><svg class="brand-logo" viewBox="0 0 1200 340" role="img" aria-label="ALCO One"><use href="#logo" width="1200" height="340"/></svg></div>
    <p class="hud-chapitre" aria-hidden="true"><i></i><span id="hudChapitre"></span></p>
    <p class="aide" aria-hidden="true"><kbd><svg class="ic"><use href="#i-prec"/></svg></kbd><kbd><svg class="ic"><use href="#i-suiv"/></svg></kbd>&nbsp;pour avancer</p>
  </header>
  <main class="stage" id="stage">
<!--SCENES-->
  </main>
  <nav class="bas" aria-label="Navigation de la présentation">
    <button class="btn" id="btnPrec" type="button"><svg class="ic"><use href="#i-prec"/></svg>Précédent</button>
    <span class="compteur" id="compteur" aria-hidden="true"></span>
    <button class="btn pri" id="btnSuiv" type="button">Suivant<svg class="ic"><use href="#i-suiv"/></svg></button>
  </nav>
</div>
<div class="vh" id="annonce" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
